<!DOCTYPE html>
<html lang="en">

<head>
    <title>Counter</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="counter-card">
        <div class="card">
            <div class="top">
                <h1 id="counter_text">Zero</h1>
                <p>
                    <span id="counter" class="in show">0</span>
                </p>
            </div>
            <div class="bottom">
                <button type="button" onclick="inc(x)">Increment</button>
                <button type="button" onclick="dec(x)">Decrement</button>
                <button type="button" onclick="reset()">Reset</button>
                <button type="button" onclick="double(this)">Single</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
